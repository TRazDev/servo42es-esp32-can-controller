    <circle cx="1060" cy="558" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="584" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="610" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="636" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="662" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="688" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="714" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="740" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="766" r="6" fill="#d4af37"/>
  </g>
  <g font-size="11" fill="#9a9a9a">
    <text x="1072" y="224">3V3</text>
    <text x="1072" y="250" fill="#f0c94a" font-weight="700">3V3</text>
    <text x="1072" y="276">RST</text>
    <text x="1072" y="302" fill="#f0c94a" font-weight="700">4</text>
    <text x="1072" y="328" fill="#f0c94a" font-weight="700">5</text>
    <text x="1072" y="354">6</text>
    <text x="1072" y="380">7</text>
    <text x="1072" y="406">15</text>
    <text x="1072" y="432">16</text>
    <text x="1072" y="458">17</text>
    <text x="1072" y="484">18</text>
    <text x="1072" y="510">8</text>
    <text x="1072" y="536">3</text>
    <text x="1072" y="562">46</text>
    <text x="1072" y="588">9</text>
    <text x="1072" y="614">10</text>
    <text x="1072" y="640">11</text>
    <text x="1072" y="666">12</text>
    <text x="1072" y="692">13</text>
    <text x="1072" y="718">14</text>
    <text x="1072" y="744">5V</text>
    <text x="1072" y="770" fill="#f0c94a" font-weight="700">GND</text>
  </g>

  <!-- right header pins (top to bottom) -->
  <g stroke="#666" stroke-width="1">
    <circle cx="1260" cy="220" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="246" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="272" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="298" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="324" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="350" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="376" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="402" r="6" fill="#6b6b6b"/>
    <circle cx="1260" cy="428" r="6" fill="#6b6b6b"/>
