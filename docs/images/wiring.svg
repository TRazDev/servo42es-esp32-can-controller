<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1010" width="1360" height="1010" font-family="Helvetica, Arial, sans-serif">
  <rect width="1360" height="1010" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="700" fill="#111">Wiring: MKS SERVO42ES → SN65HVD230 → ESP32-S3</text>
  <text x="40" y="70" font-size="13.5" fill="#555">Real pin positions. Motor seen from the back (label side), ESP32 from the component side. Gold ring = used pin.</text>

  <!-- ================= WIRES (under everything) ================= -->
  <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Power: motor side B row 1 / row 2 to PSU -->
    <path d="M334 270 H530 V180" stroke="#d62728"/>
    <path d="M334 310 H560 V180" stroke="#222222"/>
    <!-- CAN -->
    <path d="M302 470 V448 H610 V320 H680" stroke="#b28ad9"/>
    <path d="M334 470 H640 V360 H680" stroke="#7e3fb8"/>
    <!-- Module header to ESP32 left header -->
    <path d="M860 298 H1060" stroke="#1f77b4"/>
    <path d="M860 324 H1060" stroke="#2ca02c"/>
    <path d="M860 350 H980 V766 H1060" stroke="#222222"/>
    <path d="M860 376 H900 V356 A6 6 0 0 0 900 344 V330 A6 6 0 0 0 900 318 V304 A6 6 0 0 0 900 292 V246 H1060" stroke="#d62728"/>
    <!-- Common ground: motor side B row 10 to ESP32 right-bottom GND -->
    <path d="M334 630 H600 V885 H1305 V766 H1260" stroke="#222222"/>
  </g>
  <g font-size="11" fill="#555" font-style="italic">
    <text x="470" y="492">CAN H / CAN L: twist together</text>
    <text x="992" y="292">CAN TX</text>
    <text x="992" y="318">CAN RX</text>
  </g>

  <!-- ================= LAB PSU ================= -->
  <rect x="455" y="92" width="210" height="88" rx="8" fill="#f2f2f2" stroke="#999" stroke-width="1.5"/>
  <text x="470" y="118" font-size="15" font-weight="700" fill="#111">Lab power supply</text>
  <text x="470" y="138" font-size="12.5" fill="#444">24 V · current limit 1.5 A</text>
  <text x="530" y="168" font-size="15" font-weight="700" fill="#d62728" text-anchor="middle">+</text>
  <text x="560" y="168" font-size="15" font-weight="700" fill="#222" text-anchor="middle">−</text>
  <g fill="#d4af37" stroke="#7a5f10" stroke-width="1.5"><circle cx="530" cy="180" r="6"/><circle cx="560" cy="180" r="6"/></g>

  <!-- ================= MKS SERVO42ES (back view) ================= -->
  <rect x="40" y="150" width="278" height="560" rx="12" fill="#1b1b1b"/>
  <!-- motor phase terminal -->
  <rect x="120" y="128" width="110" height="36" rx="4" fill="#2e8fd6"/>
  <g fill="#cfd8dc" stroke="#555" stroke-width="1"><circle cx="138" cy="146" r="7"/><circle cx="163" cy="146" r="7"/><circle cx="188" cy="146" r="7"/><circle cx="213" cy="146" r="7"/></g>
  <text x="175" y="184" font-size="11" fill="#9fb8cc" text-anchor="middle">motor phases (factory wired)</text>
  <text x="60" y="214" font-size="17" font-weight="700" fill="#fff">MKS SERVO42ES</text>
  <text x="60" y="234" font-size="11.5" fill="#b5b5b5">back view · 2×11 connector</text>

  <!-- connector housing -->
  <rect x="286" y="248" width="64" height="444" rx="4" fill="#f4efe6" stroke="#b9b2a5" stroke-width="1.5"/>
  <text x="302" y="262" font-size="9" fill="#8a8272" text-anchor="middle">A</text>
  <text x="334" y="262" font-size="9" fill="#8a8272" text-anchor="middle">B</text>

  <!-- pins: fill = wire colour in the supplied cable -->
  <g stroke="#555" stroke-width="1">
    <!-- side A (inner column) -->
    <circle cx="302" cy="270" r="7" fill="#d62728"/>
    <circle cx="302" cy="310" r="7" fill="#222"/>
    <circle cx="302" cy="350" r="7" fill="#f2c500"/>
    <circle cx="302" cy="390" r="7" fill="#1a9a5a"/>
    <circle cx="302" cy="430" r="7" fill="#1f4fbf"/>
    <circle cx="302" cy="470" r="7" fill="#7e3fb8"/>
    <circle cx="302" cy="510" r="7" fill="#7a4a2a"/>
    <circle cx="302" cy="550" r="7" fill="#9a9a9a"/>
    <circle cx="302" cy="590" r="7" fill="#ffffff"/>
    <circle cx="302" cy="630" r="7" fill="#d62728"/>
    <circle cx="302" cy="670" r="7" fill="#f07a2a"/>
    <!-- side B (outer column) -->
    <circle cx="334" cy="270" r="7" fill="#d62728"/>
    <circle cx="334" cy="310" r="7" fill="#222"/>
    <circle cx="334" cy="350" r="7" fill="#f2c500"/>
    <circle cx="334" cy="390" r="7" fill="#1a9a5a"/>
    <circle cx="334" cy="430" r="7" fill="#1f4fbf"/>
    <circle cx="334" cy="470" r="7" fill="#7e3fb8"/>
    <circle cx="334" cy="510" r="7" fill="#7a4a2a"/>
    <circle cx="334" cy="550" r="7" fill="#9a9a9a"/>
    <circle cx="334" cy="590" r="7" fill="#ffffff"/>
    <circle cx="334" cy="630" r="7" fill="#222"/>
    <circle cx="334" cy="670" r="7" fill="#f07a2a"/>
  </g>
  <!-- used-pin rings -->
  <g fill="none" stroke="#d4af37" stroke-width="3">
    <circle cx="334" cy="270" r="10"/><circle cx="334" cy="310" r="10"/>
    <circle cx="302" cy="470" r="10"/><circle cx="334" cy="470" r="10"/>
    <circle cx="334" cy="630" r="10"/>
  </g>
  <!-- 5V output: do not connect -->
  <circle cx="302" cy="630" r="10" fill="none" stroke="#ff4d3a" stroke-width="3"/>
  <path d="M295 623 L309 637 M309 623 L295 637" stroke="#fff" stroke-width="2.5"/>

  <!-- side A labels (left of connector, on the housing) -->
  <g font-size="11.5" fill="#cfcfcf" text-anchor="end">
    <text x="280" y="274">VIN · red</text>
    <text x="280" y="314">GND · black</text>
    <text x="280" y="354">ALM− · yellow</text>
    <text x="280" y="394">PEND− · green</text>
    <text x="280" y="434">IN− · blue</text>
    <text x="280" y="474" fill="#e8c65a" font-weight="700">CAN L · purple</text>
    <text x="280" y="514">CAN L · brown</text>
    <text x="280" y="554">RS485 B · grey</text>
    <text x="280" y="594">RS485 B · white</text>
    <text x="280" y="634" fill="#ff7a6b" font-weight="700">5V OUT · red · DON'T USE</text>
    <text x="280" y="674">SWCLK · orange</text>
  </g>
  <!-- side B labels (right of connector) -->
  <g font-size="11.5" fill="#666">
    <text x="360" y="264" fill="#111" font-weight="700">VIN · red → PSU +</text>
    <text x="360" y="304" fill="#111" font-weight="700">GND · black → PSU −</text>
    <text x="360" y="354">ALM+ · yellow</text>
    <text x="360" y="394">PEND+ · green</text>
    <text x="360" y="434">IN+ · blue</text>
    <text x="360" y="464" fill="#111" font-weight="700">CAN H · purple</text>
    <text x="360" y="514">CAN H · brown</text>
    <text x="360" y="554">RS485 A · grey</text>
    <text x="360" y="594">RS485 A · white</text>
    <text x="360" y="624" fill="#111" font-weight="700">GND · black → ESP32 GND</text>
    <text x="360" y="674">SWDIO · orange</text>
  </g>

  <!-- ================= SN65HVD230 MODULE (turned 180°) ================= -->
  <text x="770" y="238" font-size="13" font-weight="700" fill="#111" text-anchor="middle">SN65HVD230 module</text>
  <rect x="680" y="250" width="180" height="170" rx="8" fill="#1f5fa8"/>
  <!-- screw terminal -->
  <rect x="664" y="298" width="30" height="84" rx="3" fill="#2e8fd6" stroke="#1a4f86"/>
  <!-- chip -->
  <rect x="742" y="304" width="56" height="44" rx="3" fill="#161616"/>
  <text x="770" y="330" font-size="10" fill="#ddd" text-anchor="middle">VP230</text>
  <!-- 120R + jumper -->
  <rect x="752" y="366" width="22" height="10" fill="#222"/>
  <rect x="780" y="362" width="12" height="18" rx="2" fill="#f2c500"/>
  <text x="770" y="404" font-size="11" fill="#d6e4f5" text-anchor="middle">120 Ω · jumper ON</text>
  <g font-size="12" fill="#fff">
    <text x="702" y="324">CANL</text>
    <text x="702" y="364">CANH</text>
  </g>
  <g font-size="12" fill="#fff" text-anchor="end">
    <text x="850" y="302">TX</text>
    <text x="850" y="328">RX</text>
    <text x="850" y="354">GND</text>
    <text x="850" y="380">3.3V</text>
  </g>
  <g fill="#d4af37" stroke="#7a5f10" stroke-width="1.5">
    <circle cx="680" cy="320" r="6"/><circle cx="680" cy="360" r="6"/>
    <circle cx="860" cy="298" r="6"/><circle cx="860" cy="324" r="6"/>
    <circle cx="860" cy="350" r="6"/><circle cx="860" cy="376" r="6"/>
  </g>
  <text x="770" y="440" font-size="11" fill="#666" text-anchor="middle">turned 180° so both sides face their wires</text>

  <!-- ================= ESP32-S3 DEV BOARD ================= -->
  <rect x="1040" y="112" width="240" height="728" rx="10" fill="#141414"/>
  <!-- antenna -->
  <rect x="1100" y="98" width="120" height="44" rx="3" fill="#222"/>
  <path d="M1110 130 V110 H1125 V130 H1140 V110 H1155 V130 H1170 V110 H1185 V130 H1200 V110 H1210" fill="none" stroke="#555" stroke-width="2"/>
  <!-- module can -->
  <rect x="1104" y="150" width="112" height="210" rx="4" fill="#b8bcc2"/>
  <text x="1160" y="232" font-size="13" font-weight="700" fill="#333" text-anchor="middle">ESP32-S3</text>
  <text x="1160" y="250" font-size="11" fill="#444" text-anchor="middle">N16R8</text>
  <!-- buttons, LED, USB chip -->
  <rect x="1170" y="440" width="26" height="22" rx="3" fill="#888"/><text x="1160" y="456" font-size="9" fill="#bbb" text-anchor="end">RST</text>
  <rect x="1170" y="486" width="26" height="22" rx="3" fill="#888"/><text x="1160" y="502" font-size="9" fill="#bbb" text-anchor="end">BOOT</text>
  <rect x="1112" y="560" width="22" height="22" rx="3" fill="#eee"/><text x="1123" y="598" font-size="9" fill="#bbb" text-anchor="middle">RGB</text>
  <rect x="1170" y="640" width="26" height="26" rx="2" fill="#2a2a2a" stroke="#555"/><text x="1183" y="682" font-size="8" fill="#999" text-anchor="middle">CH343P</text>
  <!-- USB-C x2 -->
  <rect x="1104" y="800" width="44" height="52" rx="8" fill="#c4c4c4" stroke="#777"/>
  <rect x="1172" y="800" width="44" height="52" rx="8" fill="#c4c4c4" stroke="#777"/>
  <text x="1160" y="784" font-size="10" fill="#bbb" text-anchor="middle">USB-C → computer</text>

  <!-- left header pins (top to bottom) -->
  <g stroke="#666" stroke-width="1">
    <circle cx="1060" cy="220" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="246" r="6" fill="#d4af37"/>
    <circle cx="1060" cy="272" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="298" r="6" fill="#d4af37"/>
    <circle cx="1060" cy="324" r="6" fill="#d4af37"/>
    <circle cx="1060" cy="350" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="376" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="402" r="6" fill="#6b6b6b"/>
    <circle cx="1060" cy="428" r="6" fill="#6b6b6b"/>
