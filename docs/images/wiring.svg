  </g>
  <g font-size="11" fill="#9a9a9a" text-anchor="end">
    <text x="1248" y="224">GND</text>
    <text x="1248" y="250">TX</text>
    <text x="1248" y="276">RX</text>
    <text x="1248" y="302">1</text>
    <text x="1248" y="328">2</text>
