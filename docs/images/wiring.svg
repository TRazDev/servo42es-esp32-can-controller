  <!-- ================= NOTES ================= -->
  <g font-size="13" fill="#333">
    <text x="40" y="925">• Common ground: ESP32, CAN module, motor and PSU − are all connected.</text>
    <text x="40" y="948">• Side A / B = the two rows of the motor connector. Row 10 is red on side A (5V output, never connect) and black on side B (GND).</text>
    <text x="40" y="971">• Both row-1 reds are VIN and every black is GND (connected inside the driver), so either one works.</text>
    <text x="40" y="994">• CAN module 120 Ω termination on; the motor has none. Connect the PSU last, after checking the wiring.</text>
  </g>
</svg>
